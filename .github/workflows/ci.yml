name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      base:
        description: base ref to benchmark against
        default: master
      rounds:
        description: bench rounds per side
        default: "3"
      fuzz_inputs:
        description: random programs for the differential fuzzer
        default: "20000"
      benches:
        description: space separated bench targets (empty = default set)
        default: ""
      alg_fuzz_cases:
        description: random cases per algebraic fuzz sweep (release and debug-assert)
        default: "1000000"
      alg_fuzz_seed:
        description: seed for the algebraic fuzz sweeps
        default: "1"

permissions:
  contents: read

# One workflow run per PR / branch; a new push cancels the one in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  # CARGO_TARGET_DIR and LAKE_CACHE are deliberately not set here: they live under the runner
  # user's $HOME, and values in this block are not shell expanded.  Each job exports them from
  # its toolchain step via $GITHUB_ENV, so a runner under any user works.

jobs:
  test:
    name: tests
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: toolchain
        # rustup is installed per runner user on first use
        run: |
          [ -x "$HOME/.cargo/bin/rustup" ] || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_DIR=$HOME/cache/target" >> "$GITHUB_ENV"   # persists outside _work, so builds stay incremental
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version && cargo --version
      - name: build
        run: cargo build --release --all-targets
      - name: unit + integration tests
        run: cargo test --release
      - name: tests with arena_compact + random
        run: cargo test --release --features arena_compact,random
      - name: doc tests + docs
        run: cargo doc --no-deps

  miri:
    name: cargo miri
    # Runs the unit and integration tests under Miri (default Stacked Borrows, isolation on).
    # Under cfg(miri) the crate swaps gxhash for xxhash, uses fast-slice-utils' miri_safe
    # paths, skips the zlib FFI tests and shrinks the slowest workloads.  cargo-nextest runs
    # one Miri process per test in parallel; plain `cargo miri test` is serial and takes over
    # an hour.  Ordered after the tests but not gated on them, like the fuzz job.
    needs: test
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    env:
      # Pinned because Miri changes with every nightly; bump it deliberately.
      RUSTUP_TOOLCHAIN: nightly-2026-09-23
      # Overrides `-C target-cpu=native` from .cargo/config.toml.  rustdoc never gets that flag,
      # so on an AVX-512 runner the libraries take fast-slice-utils' AVX-512 path while the
      # doc-test binary lacks the feature, and Miri reports the call as UB.  Baseline x86-64
      # keeps libraries, tests and doc tests consistent on any runner CPU.
      RUSTFLAGS: -C target-cpu=x86-64
    steps:
      - uses: actions/checkout@v5
      - name: toolchain + miri setup
        # rustup and cargo-nextest are installed per runner user on first use.  `cargo miri setup`
        # builds Miri's sysroot up front, so the test step's log and timing are only the tests.
        run: |
          [ -x "$HOME/.cargo/bin/rustup" ] || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # own target dir: miri builds would otherwise evict the stable incremental cache
          echo "CARGO_TARGET_DIR=$HOME/cache/miri-target" >> "$GITHUB_ENV"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component miri,rust-src
          command -v cargo-nextest >/dev/null || cargo install cargo-nextest --locked
          cargo miri setup
          rustc --version && cargo miri --version && cargo nextest --version
      - name: tests under miri
        run: cargo miri nextest run --no-fail-fast
      - name: doc tests under miri
        # nextest does not run doc tests
        run: cargo miri test --doc

  bench:
    name: bench A/B vs base
    # Runs last, after the tests and both fuzz gates pass (skipped when any fails), on PRs
    # and manual runs only; a push to master has nothing to compare against.
    needs: [test, fuzz, alg-fuzz]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 300
    permissions:
      contents: read
      pull-requests: write   # for the progress comment; read-only on fork PRs, where commenting is skipped
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: toolchain
        # rustup is installed per runner user on first use
        run: |
          [ -x "$HOME/.cargo/bin/rustup" ] || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_DIR=$HOME/cache/target" >> "$GITHUB_ENV"   # persists outside _work, so builds stay incremental
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: resolve base
        id: base
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            sha=${{ github.event.pull_request.base.sha }}
          else
            sha=$(git rev-parse "origin/${{ inputs.base }}" 2>/dev/null || git rev-parse "${{ inputs.base }}")
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: A/B bench
        env:
          BENCH_ROUNDS: ${{ inputs.rounds || '3' }}
          BENCHES: ${{ inputs.benches }}
          BENCH_OUT: ${{ runner.temp }}/bench-out
          GITHUB_TOKEN: ${{ github.token }}
          # Only same-repo PRs get a writable token; on fork PRs the comment calls fail and are ignored.
          PR: ${{ github.event.pull_request.number }}
        run: |
          # an empty BENCHES must fall through to the script's default set
          [ -n "$BENCHES" ] || unset BENCHES
          mkdir -p "$BENCH_OUT"
          comment() { [ -z "$PR" ] || python3 .github/scripts/pr_comment.py "$PR" "$1" || true; }
          comment "running"
          if .github/scripts/bench_ab.py "${{ steps.base.outputs.sha }}" "${{ github.sha }}"; then
            comment "done"
          else
            comment "failed, see the job log"; exit 1
          fi
      - name: summary
        if: always()
        run: |
          f="${{ runner.temp }}/bench-out/summary.md"
          [ -s "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-out
          path: |
            ${{ runner.temp }}/bench-out/*.txt
            ${{ runner.temp }}/bench-out/summary.*
          if-no-files-found: ignore

  lean:
    name: Lean model, proofs and checks
    # `lake build` type-checks the theorems in lean/PathMapModel/Spec.lean and evaluates every
    # `#guard` (the metamorphic laws over the fixture battery and the regression fixtures), so
    # a broken law or fixture fails the build.  Lean only warns on `sorry`, so that is checked
    # for separately.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: toolchain
        # elan is installed per runner user on first use and fetches the Lean pinned by lean/lean-toolchain
        run: |
          [ -x "$HOME/.elan/bin/elan" ] || curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          (cd lean && lean --version && lake --version)
      - name: build the model, check proofs and guards
        run: |
          # checkout wipes ignored files, so keep lake's build dir in the persistent cache
          mkdir -p "$HOME"/cache/lean-lake/proofs
          ln -sfn "$HOME"/cache/lean-lake/proofs lean/.lake
          cd lean
          lake build 2>&1 | tee ../lake.log
          test "${PIPESTATUS[0]}" -eq 0
      - name: no sorry, no unexpected axioms
        run: |
          if grep -n 'declaration uses .sorry.' lake.log; then
            echo "::error::a declaration uses sorry"; exit 1
          fi
          if grep -rn "\bsorry\b\|^axiom " lean/PathMapModel lean/Main.lean; then
            echo "::error::sorry or axiom in the model sources"; exit 1
          fi
      - name: summary
        if: always()
        run: |
          {
            echo "### Lean model"
            echo
            echo "| file | theorems | guards |"
            echo "|---|---:|---:|"
            for f in lean/PathMapModel/*.lean; do
              t=$(grep -c '^theorem\|^lemma' "$f" || true); g=$(grep -c '#guard' "$f" || true)
              [ "$t$g" = "00" ] || echo "| $(basename "$f") | $t | $g |"
            done
            echo
            echo "$(grep -c 'declaration uses' lake.log || true) declaration(s) use sorry; $(grep -c '^warning' lake.log || true) warning(s) from lake build."
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: differential fuzz vs Lean model
    # Regression check: head and base run on identical inputs; an input on which head diverges
    # from the model but base did not is reported as a warning annotation (master has known
    # divergences).  Set FUZZ_STRICT=1 below to make that fail the job instead.
    # Ordered after the tests but not gated on them: findings are warnings, and a PR whose
    # tests fail is exactly one whose divergences are worth seeing.
    needs: test
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write   # for the fuzz comment; read-only on fork PRs, where commenting is skipped
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: toolchains
        # Everything is installed per runner user on first use: rustup and elan into $HOME,
        # then the Rust toolchain and the Lean pinned by lean/lean-toolchain.
        run: |
          [ -x "$HOME/.cargo/bin/rustup" ] || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          [ -x "$HOME/.elan/bin/elan" ] || curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none --no-modify-path
          export PATH="$HOME/.cargo/bin:$HOME/.elan/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_DIR=$HOME/cache/target" >> "$GITHUB_ENV"   # persists outside _work, so builds stay incremental
          echo "LAKE_CACHE=$HOME/cache/lean-lake" >> "$GITHUB_ENV"   # checkout wipes ignored files such as lean/.lake
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version && cargo --version
          elan --version
          (cd lean && lean --version && lake --version)   # fetches the pinned Lean when it is missing
      - name: resolve base
        id: base
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            sha=${{ github.event.pull_request.base.sha }}
          else
            sha=$(git rev-parse "origin/${{ inputs.base }}" 2>/dev/null || git rev-parse "${{ inputs.base }}")
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: fuzz head and base
        id: fuzz
        env:
          FUZZ_INPUTS: ${{ inputs.fuzz_inputs || '20000' }}
          FUZZ_OUT: ${{ runner.temp }}/fuzz-out
        run: |
          .github/scripts/fuzz_ab.py "${{ steps.base.outputs.sha }}" "${{ github.sha }}"
      - name: comment on the PR
        # One comment per PR for this job (separate from the bench one): verdict, per-mode tables,
        # newly diverging inputs and their shrunk Rust reproducers.  Created only when there is
        # something to report; an existing comment is updated by a clean run.  Skipped when there
        # is no PR; fails silently on fork PRs, whose token is read-only.
        if: always() && github.event.pull_request.number
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/pr_comment.py --id fuzz --title "Differential fuzz vs Lean model" \
            --dir "${{ runner.temp }}/fuzz-out" --create-only-if "${{ runner.temp }}/fuzz-out/findings" \
            "${{ github.event.pull_request.number }}" "${{ steps.fuzz.outcome }}" || true
      - name: summary
        if: always()
        run: |
          f="${{ runner.temp }}/fuzz-out/summary.md"
          [ -s "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-out
          path: |
            ${{ runner.temp }}/fuzz-out/*.txt
            ${{ runner.temp }}/fuzz-out/*.md
            ${{ runner.temp }}/fuzz-out/fails-*
            ${{ runner.temp }}/fuzz-out/repro
          if-no-files-found: ignore

  alg-fuzz:
    name: algebraic equivalence fuzz
    # No oracle: every route pathmap offers through its algebra (whole-map ops, write-zipper
    # forms, experimental::zipper_algebra, OverlayZipper, SubtractZipper, ...) must give the
    # same trie, and a set of lattice laws must hold.  See differential/ALGEBRAIC_FUZZING.md.
    # Fails on any finding whose signature is missing from differential::algebraic::KNOWN,
    # which lists what already reproduces on master.  The seed and the job count are fixed, so
    # a red run reproduces locally with the command printed in the job summary: each job draws
    # its own input stream, so --jobs decides which inputs run, not only how fast.  64 is the
    # cap; a smaller machine runs the same inputs, oversubscribed.
    needs: test
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: toolchain
        # rustup is installed per runner user on first use
        run: |
          [ -x "$HOME/.cargo/bin/rustup" ] || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_DIR=$HOME/cache/target" >> "$GITHUB_ENV"   # persists outside _work, so builds stay incremental
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version && cargo --version
      - name: harness gate
        # recogniser invariants, a short sweep, and route coverage; no corpus in CI
        run: cargo test --release -p differential --test algebraic
      - name: sweep (release)
        if: ${{ !cancelled() }}
        env:
          CASES: ${{ inputs.alg_fuzz_cases || '1000000' }}
          SEED: ${{ inputs.alg_fuzz_seed || '1' }}
          JOBS: 64
          OUT: ${{ runner.temp }}/alg-fuzz-out
        run: |
          cargo build --release -p differential --bin alg_fuzz
          mkdir -p "$OUT/release"
          # a hang is a finding too: the survival-search bug in SubtractZipper looped forever
          rc=0
          timeout 20m "$CARGO_TARGET_DIR/release/alg_fuzz" --random "$CASES" --seed "$SEED" --jobs "$JOBS" \
            --out "$OUT/release" > "$OUT/release.txt" 2>&1 || rc=$?
          [ $rc -eq 124 ] && echo "::error::release sweep timed out (hang?)"
          tail -n 40 "$OUT/release.txt"
          exit $rc
      - name: sweep (debug assertions)
        # debug_assert!s inside the merge primitives catch defects no route comparison sees.
        # RUSTFLAGS replaces .cargo/config.toml's flags, so target-cpu=native (needed by gxhash)
        # is repeated; a separate target dir keeps the release build intact.
        if: ${{ !cancelled() }}
        env:
          CASES: ${{ inputs.alg_fuzz_cases || '1000000' }}
          SEED: ${{ inputs.alg_fuzz_seed || '1' }}
          JOBS: 64
          OUT: ${{ runner.temp }}/alg-fuzz-out
          RUSTFLAGS: -C target-cpu=native -C debug-assertions=yes
        run: |
          export CARGO_TARGET_DIR="$CARGO_TARGET_DIR/dbgassert"
          cargo build --release -p differential --bin alg_fuzz
          mkdir -p "$OUT/dbgassert"
          rc=0
          timeout 30m "$CARGO_TARGET_DIR/release/alg_fuzz" --random "$CASES" --seed "$SEED" --jobs "$JOBS" \
            --out "$OUT/dbgassert" > "$OUT/dbgassert.txt" 2>&1 || rc=$?
          [ $rc -eq 124 ] && echo "::error::debug-assert sweep timed out (hang?)"
          tail -n 40 "$OUT/dbgassert.txt"
          exit $rc
      - name: summary
        if: always()
        env:
          CASES: ${{ inputs.alg_fuzz_cases || '1000000' }}
          SEED: ${{ inputs.alg_fuzz_seed || '1' }}
          JOBS: 64
          OUT: ${{ runner.temp }}/alg-fuzz-out
        run: |
          {
            echo "### Algebraic equivalence fuzz"
            for mode in release dbgassert; do
              f="$OUT/$mode.txt"
              [ -e "$f" ] || continue
              if ! grep -q '^checked' "$f"; then
                # alg_fuzz reports only at the end, so a killed run leaves no counts
                echo; echo "**$mode**: no report (timed out or crashed; see the step log)"
                continue
              fi
              echo
              echo "**$mode** ($(grep -m 1 '^checked' "$f")): $(tail -n 1 "$f")"
              echo
              echo "<details><summary>findings by value type</summary>"
              echo
              echo '```text'
              sed -n '/^by value type/,/^seen under/p' "$f" | grep -v '^seen under'
              echo '```'
              echo "</details>"
            done
            echo
            echo "Reproduce: \`cargo run --release -p differential --bin alg_fuzz -- --random $CASES --seed $SEED --jobs $JOBS\`"
            echo "(debug assertions: add \`RUSTFLAGS='-C target-cpu=native -C debug-assertions=yes'\`)."
            echo "Saved inputs are in the \`alg-fuzz-out\` artifact; shrink one with \`--shrink FILE --target SIG\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alg-fuzz-out
          path: ${{ runner.temp }}/alg-fuzz-out
          if-no-files-found: ignore
