name = "pathmap-model"
defaultTargets = ["PathMapModel", "pathmap-oracle", "PrunedModel", "pruned-oracle"]

[[lean_lib]]
name = "PathMapModel"

[[lean_exe]]
name = "pathmap-oracle"
root = "Main"

# The dangling-path-free model: a second, independent specification covering
# only the subset of the API that cannot leave a dangling path (see
# PrunedModel/Map.lean), driven by pruned_differential.py.  A space in Zippy's
# set algebra is a `PrunedMap Unit`, and `PrunedModel/Zippy.lean` proves
# formal.egg's rules about it; `ZippyLaws.lean` exports those laws for the
# algebraic fuzzer.
[[lean_lib]]
name = "PrunedModel"

[[lean_exe]]
name = "pruned-oracle"
root = "PrunedMain"
