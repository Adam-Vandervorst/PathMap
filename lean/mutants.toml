# Mutation set for lean/mutate.py.
#
# Each entry names a file, a unique snippet to replace, and the replacement.
# The snippet must occur exactly once in the file, so a mutant is unambiguous.
#
# These are chosen to be semantically meaningful and to sit in code the harness
# actually covers -- a mutation in unreachable code measures nothing.  They are
# grouped by which part of the specification ought to catch them.

# --- ZipperMoving: movement and its reported distances --------------------
[[mutant]]
name = "descend_to_existing_forgets_to_ascend"
file = "src/zipper.rs"
find = """    fn descend_to_existing<K: AsRef<[u8]>>(&mut self, k: K) -> usize {
        let k = k.as_ref();
        let mut i = 0;
        while i < k.len() {
            self.descend_to_byte(k[i]);
            if !self.path_exists() {
                self.ascend_byte();
                return i
            }"""
replace = """    fn descend_to_existing<K: AsRef<[u8]>>(&mut self, k: K) -> usize {
        let k = k.as_ref();
        let mut i = 0;
        while i < k.len() {
            self.descend_to_byte(k[i]);
            if !self.path_exists() {
                return i
            }"""

