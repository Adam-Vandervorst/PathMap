[package]
name = "differential"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Rust side of the differential fuzzing harness for pathmap's zipper API; the Lean model in ../lean is the oracle"

[dependencies]
pathmap = { path = "..", features = ["arena_compact", "zipper_alg", "viz", "random", "counters"] }
# Seeded RNGs for the `random` module ops (util fuzzer, ops 88-92); the same
# rand 0.9 that pathmap uses.
rand = "0.9"
